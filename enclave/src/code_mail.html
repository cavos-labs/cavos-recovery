<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Your {{app}} sign-in code</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#ffffff;">Your code is {{code}}. It expires in 5 minutes.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
<tr><td align="center" style="padding:40px 16px 48px 16px;">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;border:1px solid #ececf0;border-radius:8px;">
<tr><td style="padding:28px 32px 0 32px;"><img src="https://cavos.xyz/cavos-black.png" width="22" height="27" alt="" style="display:block;border:0;"></td></tr>
<tr><td style="padding:28px 32px 0 32px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.015em;color:#0a0a0f;">Sign in to {{app}}</td></tr>
<tr><td style="padding:8px 32px 0 32px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#555561;">Type this code where you started signing in.</td></tr>
<tr><td style="padding:24px 32px 0 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td align="center" bgcolor="#402aff" style="background-color:#402aff;border-radius:8px;padding:26px 12px;font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:32px;line-height:38px;font-weight:600;letter-spacing:0.12em;color:#ffffff;white-space:nowrap;">{{code}}</td>
</tr></table>
</td></tr>
<tr><td style="padding:14px 32px 0 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;font-weight:500;color:#0a0a0f;">Expires in 5 minutes</td>
<td align="right" style="font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;font-weight:500;color:#0a0a0f;">Works once</td>
</tr></table>
</td></tr>
<tr><td style="padding:28px 32px 0 32px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #ececf0;font-size:0;line-height:0;height:1px;">&nbsp;</td></tr></table></td></tr>
<tr><td style="padding:18px 32px 28px 32px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#555561;">Sent to <span style="color:#0a0a0f;">{{email}}</span> because someone asked to sign in to {{app}}. If that was not you, ignore this email and nothing happens.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
